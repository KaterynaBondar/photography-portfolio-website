<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photography Portfolio | Contact</title>
    <meta name="description" content="Контактна сторінка фотографа з формою для замовлення фотосесії.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/favicon.png">
</head>

<body>

<div class="contact-wrapper">

    <header class="contact-header">

        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">

                <a class="navbar-brand logo" href="index.html">
                    <img class="logos" src="img/logo.png" alt="Logo">
                </a>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#mainMenu"
                        aria-label="Відкрити меню">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-end" id="mainMenu">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">ABOUT</a></li>
                        <li class="nav-item"><a class="nav-link" href="portfolio.html">PORTFOLIO</a></li>
                        <li class="nav-item"><a class="nav-link" href="services.html">SERVICES</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contact.html">CONTACT</a></li>
                    </ul>
                </div>

            </div>
        </nav>

    </header>

    <main>
        <section class="contact-section">
            <div class="container">

                <div class="row align-items-center">

                    <div class="col-lg-4">
                        <img src="img/contact.png" alt="Contact photo" class="contact-img">
                    </div>

                    <div class="col-lg-3 contact-info">

                        <h1>CONTACT</h1>

                        <h2>READY TO WORK WITH ME?</h2>

                        <div class="contact-item">
                            <i class="bi bi-telephone"></i>
                            <span>+380 66 767 1900</span>
                        </div>

                        <div class="contact-item">
                            <i class="bi bi-envelope"></i>
                            <span>email@gmail.com</span>
                        </div>

                        <div class="contact-item">
                            <i class="bi bi-geo-alt"></i>
                            <span>New York</span>
                        </div>

                    </div>

                    <div class="col-lg-5">

                        <form class="contact-form" id="contactForm">

                            <div class="form-group">
                                <input
                                    type="text"
                                    name="name"
                                    placeholder="Your Name"
                                    required>
                            </div>

                            <div class="form-group">
                                <input
                                    type="tel"
                                    name="phone"
                                    placeholder="Your Phone Number"
                                    required>
                            </div>

                            <div class="form-group">
                                <select name="shoot" required>
                                    <option value="">Select Shoot Type</option>
                                    <option value="portrait">Portrait Shoot</option>
                                    <option value="fashion">Fashion Shoot</option>
                                    <option value="studio">Studio Shoot</option>
                                </select>
                            </div>

                            <button type="submit">
                                Send Request
                            </button>

                        </form>

                    </div>

                </div>

                <div class="contact-social">

                    <a href="#">
                        <i class="bi bi-instagram"></i>
                    </a>

                    <a href="#">
                        <i class="bi bi-telegram"></i>
                    </a>

                </div>

            </div>
        </section>
    </main>

</div>

<footer class="footer">

    <div class="container">

        <div class="footer-box">

            <div class="footer-left">
                <h2>LET’S CREATE<br>YOUR STORY</h2>
            </div>

            <div class="footer-text">
                <p>Fashion photography • Portrait sessions • Creative content</p>
            </div>

            <div class="footer-social">
                <a href="#">INSTAGRAM</a>
                <a href="#">TELEGRAM</a>
                <a href="contact.html">CONTACT</a>
            </div>

        </div>

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const contactForm = document.getElementById('contactForm');

contactForm.addEventListener('submit', function(event) {
    event.preventDefault();

    alert('Your request has been sent successfully!');

    contactForm.reset();
});
</script>

</body>
</html>
